name: Publish Android App

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get version name
        id: version
        run: |
          # Derive version from branch name: release/v1.0.0 -> 1.0.0, 1.0.1 -> 1.0.1
          ref="${GITHUB_REF#refs/heads/}"
          version_name="${ref#release/v}"
          echo "VERSION_NAME=$version_name" >> $GITHUB_ENV
          echo "version_name=$version_name" >> $GITHUB_OUTPUT

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Decode keystore file
        uses: timheuer/base64-to-file@v1
        id: keystore
        with:
          fileName: 'keystore.jks'
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Build release APKs
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.filePath }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename Files
        run: |
          cd app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a universal x86 x86_64; do
            mv "app-${abi}-release.apk" "easyplayer-v${{ env.VERSION_NAME }}-${abi}-release.apk"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: app/build/outputs/apk/release/easyplayer*
          draft: false
          prerelease: false
          name: v${{ env.VERSION_NAME }}
          generate_release_notes: true
          tag_name: v${{ env.VERSION_NAME }}
